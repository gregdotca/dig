services:

  web:
    container_name: dig
    build:
      context: ./services/web
      dockerfile: Dockerfile
    command: bash -c 'gunicorn --bind 0.0.0.0:5000 --no-control-socket manage:app'
    ports:
      - 8091:5000
    restart: unless-stopped
    environment:
      - FLASK_APP=project/__init__.py
