services:

  web:
    container_name: dig
    build:
      context: ./services/web
      dockerfile: Dockerfile
    command: bash -c 'gunicorn --bind 0.0.0.0:5000 --workers 4 --no-control-socket manage:app'
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8091:5000"
    restart: unless-stopped
    environment:
      - FLASK_APP=project/__init__.py
